name: cam-grabber

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets & variables
        run: python check_env.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          CAMERA_ID: ${{ vars.CAMERA_ID }}
          KEEP_LAST: ${{ vars.KEEP_LAST }}

      - name: Check Supabase (DB + Storage)
        run: python check_supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
     
      - name: Run grabber
        env:
          PAGE_URL: ${{ vars.PAGE_URL }}
          CAMERA_ID: ${{ vars.CAMERA_ID }}
          KEEP_LAST: ${{ vars.KEEP_LAST }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: |
          echo "PAGE_URL=[$PAGE_URL]"
          echo "CAMERA_ID=[$CAMERA_ID]"
          echo "KEEP_LAST=[$KEEP_LAST]"
          python grab_and_store.py \
            --page-url "$PAGE_URL" \
            --camera-id "$CAMERA_ID" \
            --keep-last "$KEEP_LAST"
